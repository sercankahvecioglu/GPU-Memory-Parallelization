name: CMake

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  BUILD_TYPE: Release

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install dependencies
      run: sudo apt-get install -y cmake ninja-build openmpi-bin libopenmpi-dev

    - name: Configure CMake
      run: cmake -B ${{github.workspace}}/build -G Ninja -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}}

    - name: Build
      run: cmake --build ${{github.workspace}}/build --config ${{env.BUILD_TYPE}}

    - name: Test
      working-directory: ${{github.workspace}}/build
      # GitHub-hosted runners have only 2 CPU cores, but some Milestone 6
      # tests request 3 MPI ranks. OpenMPI treats core count as the slot
      # limit by default and refuses to oversubscribe -- this env var lifts
      # that limit for CI only; it has no effect on cluster runs, which have
      # real cores to spare.
      env:
        OMPI_MCA_rmaps_base_oversubscribe: "1"
      run: ctest -C ${{env.BUILD_TYPE}} --output-on-failure
